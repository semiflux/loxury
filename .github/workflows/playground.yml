name: playground
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [vm/**]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vm --lib --release --target wasm32-unknown-unknown --features playground
      - name: install wasm-bindgen
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;q}' Cargo.lock)
          echo "installing wasm-bindgen-cli $version"
          cargo install wasm-bindgen-cli --version "$version"
      - run: wasm-bindgen --target web --out-dir vm/play/pkg --no-typescript target/wasm32-unknown-unknown/release/vm.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vm/play
      - id: deploy
        uses: actions/deploy-pages@v4
