[package]
name = "vm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fxhash = "0.2.1"
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[features]
playground = ["dep:wasm-bindgen", "dep:serde_json"]
nan-boxing = []
