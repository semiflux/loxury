[package]
name = "vm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustc-hash = "2.1.3"
wasm-bindgen = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[features]
playground = ["dep:wasm-bindgen", "dep:serde_json"]
nan-boxing = []
